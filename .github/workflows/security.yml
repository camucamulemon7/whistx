name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '20 3 * * 1'
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --require-hashes -r requirements-dev.lock -f json -o audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit
          path: audit.json
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v3
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t whistx:scan .
      - uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: whistx:scan
          format: table
          output: container-audit.txt
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: container-audit
          path: container-audit.txt
