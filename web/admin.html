<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta id="adminThemeColor" name="theme-color" content="#f5f5f7" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("whistx_theme");
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = stored === "light" || stored === "dark" ? stored : (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
          const color = theme === "dark" ? "#0a0a0a" : "#f5f5f7";
          document.getElementById("adminThemeColor")?.setAttribute("content", color);
        } catch {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.style.colorScheme = "light";
        }
      })();
    </script>
    <title>whistx 管理画面</title>
    <link rel="stylesheet" href="/style.css?v=20260727" />
    <link rel="stylesheet" href="/admin.css?v=20260322b" />
    <script type="module" src="/admin.js?v=20260322b"></script>
  </head>
  <body>
    <div class="admin-app">
      <header class="admin-header">
        <div>
          <p class="admin-eyebrow">whistx 管理</p>
          <h1>管理画面</h1>
          <p class="admin-description">運用設定、モデル接続、ユーザーの承認と権限を管理します。</p>
        </div>
        <div class="admin-header-actions">
          <a href="/" class="admin-link-btn">アプリへ戻る</a>
          <button id="adminRefreshBtn" type="button" class="admin-primary-btn">更新</button>
        </div>
      </header>

      <p id="adminStatus" class="admin-status" aria-live="polite">読み込み中...</p>

      <section class="admin-card" style="padding:24px;margin-bottom:20px">
        <h2>運用・モデル設定</h2>
        <p>保存した設定はコンテナ再起動後に適用されます。保存期間0日は無期限です。APIキーは空欄なら変更しません。接続先にはコンテナから到達できるURLを指定してください。</p>
        <form id="serverSettingsForm" class="server-settings-form">
          <label>保存期間（日）<input name="HISTORY_RETENTION_DAYS" type="number" min="0" max="36500" required /></label>
          <label>新規登録申請<select name="ENABLE_SELF_SIGNUP"><option value="0">無効</option><option value="1">有効</option></select></label>
          <label>ゲスト文字起こし<select name="ALLOW_GUEST_TRANSCRIPTION"><option value="0">無効</option><option value="1">有効</option></select></label>
          <label>ASR方式<select name="ASR_BACKEND"><option value="qwen3_vllm">Qwen Realtime</option><option value="whisper">Whisper</option></select></label>
          <label>ASR 接続先<input name="ASR_BASE_URL" type="url" required /></label>
          <label>ASR モデル<input name="ASR_MODEL" required /></label>
          <label>ASR APIキー<input name="ASR_API_KEY" type="password" autocomplete="new-password" /></label>
          <label>要約 接続先<input name="SUMMARY_BASE_URL" type="url" required /></label>
          <label>要約 モデル<input name="SUMMARY_MODEL" required /></label>
          <label>要約 APIキー<input name="SUMMARY_API_KEY" type="password" autocomplete="new-password" /></label>
          <button type="submit" class="admin-primary-btn">設定を保存</button>
          <p id="serverSettingsStatus" role="status"></p>
        </form>
      </section>
      <main class="admin-layout">
        <section class="admin-card admin-pending-card">
          <details id="pendingPanel" class="admin-pending-shell" open>
            <summary class="admin-card-header admin-card-summary">
              <div>
                <p class="admin-section-label">承認キュー</p>
                <h2>承認待ち</h2>
                <p class="admin-card-description">新規登録されたアカウントを確認して承認します。</p>
              </div>
              <span id="pendingCount" class="admin-chip">0</span>
            </summary>
            <div id="pendingList" class="admin-list"></div>
          </details>
        </section>

        <section class="admin-card">
          <div class="admin-card-header">
            <div>
              <p class="admin-section-label">ユーザー管理</p>
              <h2>ユーザー一覧</h2>
              <p class="admin-card-description">ユーザーの権限、状態、最終ログインを確認できます。</p>
            </div>
            <span id="userCount" class="admin-chip">0</span>
          </div>

          <form id="userSearchForm" class="admin-search-bar" role="search">
            <label class="admin-search-label" for="userSearchInput">ユーザー検索</label>
            <input
              id="userSearchInput"
              class="admin-search-input"
              type="search"
              name="q"
              placeholder="表示名またはメールアドレスで検索"
              autocomplete="off"
            />
            <button type="submit" class="admin-primary-btn">検索</button>
            <button id="userSearchClearBtn" type="button" class="admin-link-btn">クリア</button>
          </form>

          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>ユーザー</th>
                  <th>権限</th>
                  <th>状態</th>
                  <th>作成日</th>
                  <th>最終ログイン</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="userTableBody"></tbody>
            </table>
          </div>

          <div id="userCards" class="admin-user-cards"></div>
        </section>
      </main>
    </div>
  </body>
</html>
